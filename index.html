<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로또번호 추천사이트</title>
    <meta name="description" content="간단하게 로또번호를 추천받는 사이트입니다." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="card">
        <div class="theme-toggle-container">
          <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="화면 테마 전환">☀️</button>
        </div>

        <header class="hero">
          <p class="eyebrow">오늘의 운세를 담아</p>
          <h1>로또번호 추천사이트</h1>
          <p class="subtitle">클릭 한 번으로 당첨 확률을 높여줄 번호를 생성해보세요.</p>
        </header>

        <div class="actions">
          <button id="generateBtn" class="primary-btn">번호 생성하기</button>
          <button id="clearBtn" class="secondary-btn">기록 지우기</button>
        </div>

        <section class="result-area">
          <h2>추천 번호</h2>
          <div id="numbers" class="number-grid" aria-live="polite"></div>
        </section>

        <section class="history-area">
          <h2>최근 추천 기록</h2>
          <ul id="historyList" class="history-list"></ul>
        </section>

        <section class="contact-area" aria-labelledby="contactTitle">
          <h2 id="contactTitle">제휴 문의</h2>
          <p class="contact-description">서비스 제휴, 광고, 협업 제안이 있다면 아래 양식으로 보내주세요.</p>
          <form id="contactForm" class="contact-form" action="https://formspree.io/f/mljrdabw" method="POST">
            <label>
              이름
              <input type="text" name="name" placeholder="홍길동" required />
            </label>
            <label>
              이메일
              <input type="email" name="email" placeholder="example@email.com" required />
            </label>
            <label>
              문의 내용
              <textarea name="message" rows="5" placeholder="제휴 제안 내용을 입력해주세요." required></textarea>
            </label>
            <button type="submit" class="primary-btn contact-submit">문의 보내기</button>
            <p id="formStatus" class="form-status" aria-live="polite"></p>
          </form>
        </section>

        <section class="comments-area" aria-labelledby="commentsTitle">
          <h2 id="commentsTitle">댓글</h2>
          <div id="disqus_thread"></div>
          <script>
            var disqus_config = function () {
              this.page.url = window.location.href;
              this.page.identifier = 'kimking-home';
            };

            (function () {
              var d = document;
              var s = d.createElement('script');
              s.src = 'https://https-kimking-pages-dev.disqus.com/embed.js';
              s.setAttribute('data-timestamp', +new Date());
              (d.head || d.body).appendChild(s);
            })();
          </script>
          <noscript>
            Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a>
          </noscript>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
